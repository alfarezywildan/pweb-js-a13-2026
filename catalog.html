<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk - Mini Shopee</title>
  <link rel="stylesheet" href="catalog.css">

  <script src="catalog.js" defer></script>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">Mini Shopee</div>
  <div class="nav-user">
  <span id="welcomeMessage">Selamat datang, Guest</span>

  <div class="cart-info">
    <span>
      🛒 Keranjang:
      <span id="cart-badge">0</span>
    </span>

    <span>
      Total:
      <span id="cart-total">$0.00</span>
    </span>

    <button id="clear-cart">Kosongkan Keranjang</button>
  </div>

  <button id="logoutBtn">Logout</button>
</div>
</nav>

  <main class="container">
    <section class="controls-section">
      <input type="text" id="search-input" placeholder="Cari nama atau kategori produk...">
      
      <select id="category-filter">
        <option value="all">Semua Kategori</option>
      </select>

      <select id="sort-filter">
        <option value="default">Urutkan</option>
        <option value="price-asc">Harga termurah</option>
        <option value="price-desc">Harga termahal</option>
        <option value="rating-desc">Rating tertinggi</option>
      </select>
    </section>

    <!-- Wadah utama untuk render produk dinamis -->
    <section id="product-grid" class="grid-container">
    </section>
    
    <div class="load-more-container">
      <button id="btn-load-more">Load More</button>
    </div>
  </main>

  <div id="product-modal" class="modal" hidden>
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>

      <img id="modal-image" src="" alt="Gambar produk">

      <div class="modal-info">
        <h2 id="modal-title"></h2>

        <p id="modal-price"></p>
        <p id="modal-rating"></p>
        <p id="modal-stock"></p>
        <p id="modal-brand"></p>
        <p id="modal-category"></p>
        <p id="modal-description"></p>
        
        <button id="modal-add-cart" class="btn-tambah-keranjang">
          Tambah ke Keranjang
        </button>
      </div>
    </div>
  </div>

</body>
</html>
